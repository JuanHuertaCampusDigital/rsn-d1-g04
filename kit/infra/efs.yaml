AWSTemplateFormatVersion: "2010-09-09"
Description: EFS cifrado para el reto Saica
Parameters:
  VpcId: {Type: AWS::EC2::VPC::Id}
  SubnetA: {Type: AWS::EC2::Subnet::Id}
  SubnetB: {Type: AWS::EC2::Subnet::Id}
  ClientSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
Resources:
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS solo desde clientes Saica
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
  SharedFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      BackupPolicy: {Status: ENABLED}
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      FileSystemTags:
        - {Key: Name, Value: saica-g03-efs-reports}
        - {Key: project, Value: saica-reto}
        - {Key: team, Value: g03}
        - {Key: expires, Value: "FECHA_FIN_VENTANA"}
        - {Key: ra, Value: DAT-RA3}
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref SharedFileSystem
      SubnetId: !Ref SubnetA
      SecurityGroups: [!Ref EfsSecurityGroup]
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref SharedFileSystem
      SubnetId: !Ref SubnetB
      SecurityGroups: [!Ref EfsSecurityGroup]
Outputs:
  FileSystemId:
    Value: !Ref SharedFileSystem
